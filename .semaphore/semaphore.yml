version: v1.0
name: "\U0001F48E Ruby CI Pipeline"
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404
fail_fast:
  stop:
    when: branch != 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'
global_job_config:
  prologue:
    commands:
      - checkout
      - sem-version ruby 4.0.0
      # .ruby-version pins 3.3 for local use and would override sem-version.
      - export RBENV_VERSION="$(rbenv global)"
      - bundle config set --local path 'vendor/bundle'
      - bundle config set --local deployment 'true'
      - cache restore
blocks:
  - name: "\U0001F6E0 Setup & Cache"
    task:
      jobs:
        - name: Install Gems
          commands:
            - bundle install
            - cache store
    dependencies: []
  - name: "\U0001F9F9 RuboCop"
    task:
      jobs:
        - name: Ruby Style Check
          commands:
            - bundle exec rubocop
    dependencies:
      - "\U0001F6E0 Setup & Cache"
  - name: "\U0001F6E1️ Bundler Audit"
    task:
      jobs:
        - name: Gem CVE Check
          commands:
            - gem install --no-document bundler-audit
            - bundle-audit check --update
    dependencies:
      - "\U0001F6E0 Setup & Cache"
  - name: "\U0001F6A6 Tests"
    task:
      jobs:
        - name: "\U0001F7E2 Unit and acceptance tests"
          commands:
            - bundle exec rake test
    dependencies:
      - "\U0001F6E0 Setup & Cache"
