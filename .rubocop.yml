AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - node_modules/**/*
    - vendor/**/*

Layout/LineLength:
  Max: 120

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/Documentation:
  Enabled: false

Style/PerlBackrefs:
  Exclude:
    - test/acceptance/support/fake_github.rb

Metrics:
  Exclude:
    - test/**/*

Metrics/AbcSize:
  Max: 30

Metrics/ClassLength:
  Max: 300

Metrics/CyclomaticComplexity:
  Max: 12

Metrics/MethodLength:
  Max: 20

Metrics/PerceivedComplexity:
  Max: 12

Metrics/ParameterLists:
  CountKeywordArgs: false

Naming/PredicateMethod:
  Exclude:
    - test/**/*
